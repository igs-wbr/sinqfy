# Trackify em qualquer VPS com Docker (Oracle, Hetzner, DigitalOcean, Contabo, Hostinger, Magalu, AWS, a sua máquina...).
# Uso: na pasta deploy/, `docker compose up -d --build` (variáveis em deploy/.env; veja docs/hospedagem.md).
#
# Como o painel chega à internet: escolha UM jeito em COMPOSE_PROFILES no .env.
#   cloudflare  túnel da Cloudflare: nenhuma porta aberta na VPS (precisa de TUNNEL_TOKEN)
#   caddy       HTTPS automático (Let's Encrypt) direto na VPS: abra as portas 80 e 443 (precisa de DOMAIN)
#   (vazio)     só o painel em 127.0.0.1:8080, para pôr atrás do seu próprio Nginx, Traefik ou outro proxy
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rastro
      POSTGRES_DB: rastro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "rastro"], interval: 10s, retries: 5 }

  app:
    build: ..
    restart: unless-stopped
    depends_on: { postgres: { condition: service_healthy } }
    env_file: .env
    environment:
      DATABASE_URL: postgres://rastro:${POSTGRES_PASSWORD}@postgres:5432/rastro
      TRUST_PROXY: "1"
      COOKIE_SECURE: "1"
    # Só nesta máquina: para um proxy próprio (sem perfil) ou para conferir com curl. Nunca aberto para a internet.
    ports: ["127.0.0.1:8080:8080"]

  cloudflared:
    profiles: [cloudflare]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on: [app]

  caddy:
    profiles: [caddy]
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [app]

volumes:
  pgdata:
  caddy_data:
