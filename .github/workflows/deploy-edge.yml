name: Deploy do Worker
# Publica o Worker da borda (edge/) na Cloudflare a cada push na main que mexe nele. Configuração em
# docs/guia-cloudflare.md (parte 3): segredo CLOUDFLARE_API_TOKEN e variáveis CLOUDFLARE_ACCOUNT_ID,
# TRACKIFY_ORIGIN e TRACKIFY_PANEL_HOST em Settings, Secrets and variables, Actions.
on:
  push:
    branches: [main]
    paths: ['edge/**', '.github/workflows/deploy-edge.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency: deploy-edge
jobs:
  deploy:
    # Forks e cópias sem a configuração não tentam publicar.
    if: vars.TRACKIFY_ORIGIN != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Testes do Worker
        run: node --test tests/edge.test.js
      - name: Publicar
        working-directory: edge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::warning::Falta o segredo CLOUDFLARE_API_TOKEN; nada foi publicado."; exit 0; fi
          npx --yes wrangler@4 deploy --var "ORIGIN:${{ vars.TRACKIFY_ORIGIN }}" --var "PANEL_HOST:${{ vars.TRACKIFY_PANEL_HOST }}"
