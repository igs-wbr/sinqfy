# Worker da borda do Sinqfy: script, eventos, links de WhatsApp e, se quiser, o painel no mesmo endereço.
# Deploy automático: .github/workflows/deploy-edge.yml (a cada push na main que mexe em edge/).
# Deploy manual, na pasta edge/: npx wrangler deploy --var ORIGIN:https://app.seudominio.com.br
# Segredo (o mesmo EDGE_SECRET do painel), uma vez só: npx wrangler secret put EDGE_SECRET
name = "trackify"
main = "worker.js"
compatibility_date = "2026-10-01"

# Endereço <nome>.<sua-conta>.workers.dev. Funciona sem domínio próprio na Cloudflare.
workers_dev = true
# Sem endereço extra por versão: o painel só responde no PANEL_HOST.
preview_urls = false

# Valores de cada instalação. No deploy automático vêm das variáveis do repositório (TRACKIFY_ORIGIN e TRACKIFY_PANEL_HOST).
# ORIGIN: onde o painel roda (túnel da Cloudflare). PANEL_HOST: host em que o Worker também mostra o painel; vazio desliga.
[vars]
ORIGIN = "https://app.seudominio.com.br"
PANEL_HOST = ""

# Limite de eventos por IP (protege a fila e a cota da Meta contra inundação).
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

# Com domínio na Cloudflare: descomente para servir em t.seudominio e nos domínios dos clientes (Cloudflare for SaaS).
# routes = [
#   { pattern = "t.seudominio.com.br", custom_domain = true },
#   { pattern = "*/*", zone_name = "seudominio.com.br" },
# ]

# Com o R2 ativado na conta: eventos que o painel não recebeu ficam guardados 30 dias. Crie antes:
#   npx wrangler r2 bucket create trackify-raw
#   npx wrangler r2 bucket lifecycle add trackify-raw expira-30d failed/ --expire-days 30
# [[r2_buckets]]
# binding = "RAW"
# bucket_name = "trackify-raw"
