# Worker da borda do Rastro. Deploy: na pasta edge/, `npx wrangler deploy`.
# Segredo (o mesmo EDGE_SECRET do painel): `npx wrangler secret put EDGE_SECRET`.
name = "rastro-edge"
main = "worker.js"
compatibility_date = "2026-10-01"

# O seu subdomínio e os domínios dos clientes (Cloudflare for SaaS: os t.cliente.com.br cadastrados pelo painel chegam pela rota */*).
# Antes, na zona: SSL/TLS, Custom Hostnames, defina o fallback origin (ex.: edge.seudominio.com.br, um registro proxied qualquer).
routes = [
  { pattern = "t.seudominio.com.br", custom_domain = true },
  { pattern = "*/*", zone_name = "seudominio.com.br" },
]

[vars]
ORIGIN = "https://app.seudominio.com.br"

# Beacons que a origem não conseguiu receber ficam aqui para reprocessar, sem IP nem user agent. Crie o bucket e a regra de 30 dias:
#   npx wrangler r2 bucket create rastro-raw
#   npx wrangler r2 bucket lifecycle add rastro-raw expira-30d failed/ --expire-days 30
[[r2_buckets]]
binding = "RAW"
bucket_name = "rastro-raw"

# Limite de beacons por IP (protege a fila e a cota da Meta do cliente contra inundação).
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 120, period = 60 }
