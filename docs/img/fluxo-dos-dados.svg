<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>Como o dado anda no Trackify</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#525252"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E58DB"/></marker>
  </defs>
  <rect width="960" height="470" rx="16" fill="#FAFAFA"/>
  <text x="32" y="44" font-size="20" font-weight="600" fill="#171717">Como o dado anda</text>
  <text x="32" y="68" font-size="13" fill="#525252">Do clique no anúncio até a venda voltar para a Meta. O azul é o que o Trackify faz sozinho.</text>

  <!-- linha de cima: visita -->
  <g font-size="13" fill="#171717">
    <rect x="32" y="100" width="150" height="76" rx="12" fill="#fff" stroke="#D8D8DC"/>
    <text x="107" y="132" text-anchor="middle" font-weight="600">1. Anúncio</text>
    <text x="107" y="152" text-anchor="middle" fill="#525252" font-size="12">Meta Ads, com UTM</text>

    <rect x="222" y="100" width="170" height="76" rx="12" fill="#fff" stroke="#D8D8DC"/>
    <text x="307" y="132" text-anchor="middle" font-weight="600">2. Seu site</text>
    <text x="307" y="152" text-anchor="middle" fill="#525252" font-size="12">com o script s.js</text>

    <rect x="432" y="100" width="200" height="76" rx="12" fill="#EEF3FD" stroke="#0E58DB"/>
    <text x="532" y="132" text-anchor="middle" font-weight="600">3. t.seudominio</text>
    <text x="532" y="152" text-anchor="middle" fill="#525252" font-size="12">Cloudflare grava o cookie</text>

    <rect x="672" y="100" width="256" height="196" rx="12" fill="#0E58DB"/>
    <text x="800" y="140" text-anchor="middle" font-weight="600" fill="#fff" font-size="16">4. Painel Trackify</text>
    <text x="800" y="164" text-anchor="middle" fill="#DCE7FB" font-size="12">na sua VPS da Oracle</text>
    <text x="800" y="200" text-anchor="middle" fill="#fff" font-size="12">junta visita + venda + gasto</text>
    <text x="800" y="222" text-anchor="middle" fill="#fff" font-size="12">mostra ROAS, lucro, funis</text>
    <text x="800" y="244" text-anchor="middle" fill="#fff" font-size="12">guarda contatos cifrados</text>
    <text x="800" y="266" text-anchor="middle" fill="#fff" font-size="12">envia eventos com reenvio</text>
  </g>
  <g fill="none" stroke-width="2">
    <path d="M182 138H218" stroke="#525252" marker-end="url(#a)"/>
    <path d="M392 138H428" stroke="#525252" marker-end="url(#a)"/>
    <path d="M632 138H668" stroke="#0E58DB" marker-end="url(#b)"/>
  </g>
  <text x="318" y="216" font-size="11" fill="#6B6B70">clique em comprar leva o rid</text>

  <!-- linha de baixo: venda e conversas -->
  <g font-size="13" fill="#171717">
    <rect x="222" y="250" width="170" height="76" rx="12" fill="#fff" stroke="#D8D8DC"/>
    <text x="307" y="282" text-anchor="middle" font-weight="600">5. Checkout</text>
    <text x="307" y="302" text-anchor="middle" fill="#525252" font-size="12">Hotmart, Kiwify, Eduzz...</text>

    <rect x="432" y="250" width="200" height="76" rx="12" fill="#fff" stroke="#D8D8DC"/>
    <text x="532" y="282" text-anchor="middle" font-weight="600">WhatsApp (opcional)</text>
    <text x="532" y="302" text-anchor="middle" fill="#525252" font-size="12">conversas e cliques</text>
  </g>
  <g fill="none" stroke-width="2">
    <path d="M307 176V246" stroke="#525252" marker-end="url(#a)"/>
    <path d="M392 306C470 390 620 380 668 280" stroke="#525252" marker-end="url(#a)"/>
    <path d="M632 288H668" stroke="#525252" marker-end="url(#a)"/>
  </g>
  <text x="530" y="394" text-anchor="middle" font-size="11" fill="#6B6B70">webhook: "a venda X foi paga"</text>

  <!-- volta para a Meta -->
  <g font-size="13" fill="#171717">
    <rect x="672" y="340" width="256" height="96" rx="12" fill="#fff" stroke="#0E58DB" stroke-width="1.5"/>
    <text x="800" y="372" text-anchor="middle" font-weight="600">6. Meta e GA4</text>
    <text x="800" y="394" text-anchor="middle" fill="#525252" font-size="12">recebem a compra pelo servidor</text>
    <text x="800" y="414" text-anchor="middle" fill="#525252" font-size="12">e otimizam os anúncios</text>
  </g>
  <path d="M800 296V336" fill="none" stroke="#0E58DB" stroke-width="2" marker-end="url(#b)"/>
  <path d="M672 410C420 450 140 430 107 180" fill="none" stroke="#0E58DB" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#b)"/>
  <text x="300" y="448" text-anchor="middle" font-size="11" fill="#0E58DB">a Meta aprende quem compra e mostra o anúncio para mais gente parecida</text>
</svg>
