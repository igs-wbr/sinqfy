<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>O caminho, do zero ao rastreamento funcionando</title>
  <rect width="960" height="300" rx="16" fill="#FAFAFA"/>
  <text x="32" y="44" font-size="20" font-weight="600" fill="#171717">O caminho, do zero ao rastreamento funcionando</text>
  <text x="32" y="68" font-size="13" fill="#525252">Faça na ordem. Cada etapa tem um sinal claro de que deu certo.</text>
  <path d="M86 150H874" stroke="#D8D8DC" stroke-width="4" stroke-linecap="round"/>
  <g font-size="13" text-anchor="middle" fill="#171717">
    <g><circle cx="86" cy="150" r="22" fill="#0E58DB"/><text x="86" y="155" fill="#fff" font-weight="600">1</text>
      <text x="86" y="200" font-weight="600">Servidor</text><text x="86" y="218" font-size="11" fill="#525252">Oracle + Cloudflare</text><text x="86" y="236" font-size="11" fill="#6B6B70">painel abre</text></g>
    <g><circle cx="217" cy="150" r="22" fill="#0E58DB"/><text x="217" y="155" fill="#fff" font-weight="600">2</text>
      <text x="217" y="200" font-weight="600">Site</text><text x="217" y="218" font-size="11" fill="#525252">cadastrar no painel</text><text x="217" y="236" font-size="11" fill="#6B6B70">aparece no menu</text></g>
    <g><circle cx="348" cy="150" r="22" fill="#0E58DB"/><text x="348" y="155" fill="#fff" font-weight="600">3</text>
      <text x="348" y="200" font-weight="600">Domínio t.</text><text x="348" y="218" font-size="11" fill="#525252">CNAME no DNS</text><text x="348" y="236" font-size="11" fill="#6B6B70">status Ativo</text></g>
    <g><circle cx="479" cy="150" r="22" fill="#0E58DB"/><text x="479" y="155" fill="#fff" font-weight="600">4</text>
      <text x="479" y="200" font-weight="600">Script</text><text x="479" y="218" font-size="11" fill="#525252">colar no site</text><text x="479" y="236" font-size="11" fill="#6B6B70">1º evento chega</text></g>
    <g><circle cx="610" cy="150" r="22" fill="#0E58DB"/><text x="610" y="155" fill="#fff" font-weight="600">5</text>
      <text x="610" y="200" font-weight="600">Meta</text><text x="610" y="218" font-size="11" fill="#525252">pixel, token, UTM</text><text x="610" y="236" font-size="11" fill="#6B6B70">teste de conexão ok</text></g>
    <g><circle cx="741" cy="150" r="22" fill="#0E58DB"/><text x="741" y="155" fill="#fff" font-weight="600">6</text>
      <text x="741" y="200" font-weight="600">Vendas</text><text x="741" y="218" font-size="11" fill="#525252">webhook da plataforma</text><text x="741" y="236" font-size="11" fill="#6B6B70">pedido de teste chega</text></g>
    <g><circle cx="874" cy="150" r="22" fill="#fff" stroke="#0E58DB" stroke-width="3"/><text x="874" y="155" fill="#0E58DB" font-weight="600">7</text>
      <text x="874" y="200" font-weight="600">Teste final</text><text x="874" y="218" font-size="11" fill="#525252">cookie + envio aceito</text><text x="874" y="236" font-size="11" fill="#6B6B70">tudo verde</text></g>
  </g>
  <text x="32" y="276" font-size="12" fill="#525252">Depois: WhatsApp, CRM e os recursos opcionais (recuperação, públicos, checkout Pix), na hora que precisar.</text>
</svg>
